name: Security check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check forbidden secret files and common token patterns
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          import re
          import subprocess
          import sys

          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          forbidden_names = {
              ".env",
              "serviceAccountKey.json",
          }
          forbidden_suffixes = {".key", ".p12", ".pfx", ".jks", ".keystore"}
          allowed = {".env.example", "deploy/certs/.gitkeep", "secrets/.gitkeep"}

          errors = []
          for name in tracked:
              path = pathlib.PurePosixPath(name)
              if name in allowed:
                  continue
              if path.name in forbidden_names:
                  errors.append(f"Forbidden tracked secret file: {name}")
              if path.suffix.lower() in forbidden_suffixes:
                  errors.append(f"Forbidden private key file: {name}")
              if name.startswith("deploy/certs/") and path.name != ".gitkeep":
                  errors.append(f"Certificate/key must stay local: {name}")
              if "service-account" in path.name.lower() or "service_account" in path.name.lower():
                  errors.append(f"Possible service account credential file: {name}")

          patterns = {
              "private key": re.compile(r"-----BEGIN [A-Z ]*PRIVATE KEY-----"),
              "Google API key": re.compile(r"AIza[0-9A-Za-z_-]{30,}"),
              "AWS access key": re.compile(r"AKIA[0-9A-Z]{16}"),
              "GitHub token": re.compile(r"(?:ghp_|github_pat_)[A-Za-z0-9_]{20,}"),
              "OpenAI-style secret": re.compile(r"sk-[A-Za-z0-9_-]{20,}"),
              "Firebase private_key JSON": re.compile(r'"private_key"\s*:\s*"-----BEGIN'),
          }

          text_exts = {".py", ".js", ".jsx", ".ts", ".tsx", ".json", ".yml", ".yaml", ".env", ".txt", ".conf", ".ps1", ".sh"}
          for name in tracked:
              if name == ".env.example":
                  continue
              path = pathlib.Path(name)
              if not path.exists() or not path.is_file():
                  continue
              if path.suffix.lower() not in text_exts and path.name not in {"Dockerfile", ".gitignore"}:
                  continue
              try:
                  data = path.read_text("utf-8", errors="ignore")
              except Exception:
                  continue
              for label, pattern in patterns.items():
                  if pattern.search(data):
                      errors.append(f"Possible {label} in tracked file: {name}")

          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print("No tracked secret files or common secret patterns found.")
          PY
